name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    # ⚠ **自前の台で回す**（forge へ移したとき変えた）。
    runs-on: [self-hosted, nolumialab]
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        # ⚠ **鏡に無いので自前の鏡を完全な URL で指す**（forge へ移したため）。
        uses: https://git.nolumia.com/astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Test
        run: uv run pytest -v --tb=short
