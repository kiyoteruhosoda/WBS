name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

# When pushing again to the same branch (PR), cancel the older run and check only the latest commit.
# ⚠ **main is cancelled too** (decided 2026-09-28). Intermediate commits get no verdict, but in exchange
#   old checks do not block the runner queue on days with many pushes to main. Do not apply this to workflows with side effects.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test (Python)
    # ⚠ **Runs on our own runners** (changed when moving to forge).
    runs-on: [self-hosted, nolumialab]
    env:
      # Python installed by uv also comes from forge (the default is GitHub's python-build-standalone).
      # If a version bump fails, add that tag's files to the astral-sh/python-build-standalone release.
      UV_PYTHON_INSTALL_MIRROR: "https://git.nolumia.com/astral-sh/python-build-standalone/releases/download"

    steps:
      - uses: actions/checkout@v6

      - name: Python version matches the production image
        # ⚠ **The test Python is the version in `.python-version`** (read by uv). Fail if it drifts from the production image
        #   (`FROM python:X.Y` in the Dockerfile). Renovate bumps both in one PR (task #461).
        #   CI once stayed on 3.12 while only production moved to 3.14.
        run: |
          want="$(tr -d '[:space:]' < .python-version)"
          got="$(git ls-files 'Dockerfile' '*/Dockerfile' | xargs grep -hoE '^FROM +python:[0-9]+\.[0-9]+' | sed -E 's/^FROM +python://' | sort -u)"
          echo ".python-version: ${want} / Dockerfile: ${got//$'\n'/ }"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "::error::.python-version (${want}) and the Dockerfile FROM python (${got//$'\n'/ }) do not match"
            exit 1
          fi

      - name: Set up uv
        # ⚠ **Not on the mirror, so point at our own mirror with a full URL** (since moving to forge).
        uses: https://git.nolumia.com/astral-sh/setup-uv@v6
        with:
          # No version here: use the latest in the manifest-file list (forge's copy, imported weekly). With manifest-file it never calls the GitHub API (2026-10-27).
          # ⚠ **The binary comes from forge** (no GitHub dependency). It lives in the astral-sh/uv
          #   releases, listed by version-manifest.json. host/astral-mirror imports the list weekly.
          manifest-file: "https://git.nolumia.com/astral-sh/uv/raw/branch/main/version-manifest.json"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Migrations (alembic CLI)
        # On an empty DB go head -> base -> head, then check there is no diff against the models (autogenerate).
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/alembic-check.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Test
        run: uv run pytest -v --tb=short

  frontend:
    name: Frontend
    # ⚠ **Runs on our own runners**, in the runner's default job image (with node). Do not write `container:`.
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      # ⚠ **It is on the default mirror (data.forgejo.org), so do not use a full URL**.
      #   Our own mirror (git.nolumia.com) has no setup-node (unlike setup-uv).
      # ⚠ **Do not set node-version**. If set, setup-node first fetches the list from api.github.com
      #   even when pointed at a mirror (a GitHub dependency). Use Node 24 from the runner image (node:24-bookworm) as is.
      #   The production image (frontend/Dockerfile) is also aligned on node:24-alpine (2026-10-01, task #151).
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: TypeScript (type check)
        run: npx tsc -b

      - name: oxlint (static analysis)
        # Even if the type check fails we want lint and build results. Stop only when dependencies failed to install.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: vitest (pure function tests)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test

      - name: Build (tsc -b && vite build)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
