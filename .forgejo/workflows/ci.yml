name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

# 同じ枝（PR）へ続けて push したら、古い実行は取り消して最新の commit だけを検査する。
# ⚠ **main も取り消す**（2026-09-28 の決定）。間の commit には合否が残らない代わりに、
#   main への push が続いた日に古い検査がランナーの列を塞がない。副作用のある workflow には当てない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    # ⚠ **自前の台で回す**（forge へ移したとき変えた）。
    runs-on: [self-hosted, nolumialab]
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        # ⚠ **鏡に無いので自前の鏡を完全な URL で指す**（forge へ移したため）。
        uses: https://git.nolumia.com/astral-sh/setup-uv@v6
        with:
          # ⚠ **版を固定する**。省くと最新版を GitHub の API へ匿名で聞きに行き、
          #   レート制限（60 回/時・IP ごと）に当たると 3 秒で落ちる（2026-10-01、PR #15）。
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Migrations (alembic CLI)
        # 空の DB に head → base → head、そのあとモデルとの差が無いこと（autogenerate）を見る。
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/alembic-check.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Test
        run: uv run pytest -v --tb=short

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    # ⚠ **自前の台で回す**。台の既定のジョブイメージ（node 入り）で走る。`container:` は書かない。
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        # 本番の像（frontend/Dockerfile の node:22-alpine）と揃える。
        node-version: ["22"]

    steps:
      - uses: actions/checkout@v6

      # ⚠ **既定の鏡（data.forgejo.org）に在るので完全な URL にしない**。
      #   自前の鏡（git.nolumia.com）には setup-node は無い（setup-uv とは事情が違う）。
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: TypeScript (型検査)
        run: npx tsc -b

      - name: oxlint (静的解析)
        # 型検査が落ちても lint と build の結果は見たい。依存が入らなかったときだけ止める。
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: vitest (純関数の試験)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test

      - name: Build (tsc -b && vite build)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
