name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

# 同じ枝（PR）へ続けて push したら、古い実行は取り消して最新の commit だけを検査する。
# ⚠ **main も取り消す**（2026-09-28 の決定）。間の commit には合否が残らない代わりに、
#   main への push が続いた日に古い検査がランナーの列を塞がない。副作用のある workflow には当てない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test (Python)
    # ⚠ **自前の台で回す**（forge へ移したとき変えた）。
    runs-on: [self-hosted, nolumialab]
    env:
      # uv が入れる Python も forge から（既定は GitHub の python-build-standalone）。
      # 版を上げて落ちたら、その tag のファイルを astral-sh/python-build-standalone のリリースに足す。
      UV_PYTHON_INSTALL_MIRROR: "https://git.nolumia.com/astral-sh/python-build-standalone/releases/download"

    steps:
      - uses: actions/checkout@v6

      - name: Python の版が本番のイメージと揃っているか
        # ⚠ **試験の Python は `.python-version` の版**（uv が読む）。本番のイメージ（Dockerfile の
        #   `FROM python:X.Y`）とずれたら落とす。Renovate は両方を 1 本の PR で上げる（task #461）。
        #   CI だけ 3.12 のまま、本番だけ 3.14 に上がっていた。
        run: |
          want="$(tr -d '[:space:]' < .python-version)"
          got="$(git ls-files 'Dockerfile' '*/Dockerfile' | xargs grep -hoE '^FROM +python:[0-9]+\.[0-9]+' | sed -E 's/^FROM +python://' | sort -u)"
          echo ".python-version: ${want} / Dockerfile: ${got//$'\n'/ }"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "::error::.python-version（${want}）と Dockerfile の FROM python（${got//$'\n'/ }）が揃っていない"
            exit 1
          fi

      - name: Set up uv
        # ⚠ **鏡に無いので自前の鏡を完全な URL で指す**（forge へ移したため）。
        uses: https://git.nolumia.com/astral-sh/setup-uv@v6
        with:
          # 版は書かない: manifest-file の一覧（forge の写し・毎週取り込み）の最新を使う。manifest-file があれば GitHub の API へは行かない（2026-10-27）。
          # ⚠ **本体は forge から取る**（GitHub に依存しない）。置き場は astral-sh/uv の
          #   リリース、その一覧が version-manifest.json。一覧は host/astral-mirror が毎週取り込む。
          manifest-file: "https://git.nolumia.com/astral-sh/uv/raw/branch/main/version-manifest.json"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Migrations (alembic CLI)
        # 空の DB に head → base → head、そのあとモデルとの差が無いこと（autogenerate）を見る。
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/alembic-check.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

      - name: Test
        run: uv run pytest -v --tb=short

  frontend:
    name: Frontend
    # ⚠ **自前の台で回す**。台の既定のジョブイメージ（node 入り）で走る。`container:` は書かない。
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      # ⚠ **既定の鏡（data.forgejo.org）に在るので完全な URL にしない**。
      #   自前の鏡（git.nolumia.com）には setup-node は無い（setup-uv とは事情が違う）。
      # ⚠ **node-version は書かない**。書くと setup-node は鏡を指しても先に api.github.com の
      #   一覧を引く（GitHub に依存する）。台の像（node:24-bookworm）の Node 24 をそのまま使う。
      #   本番の像（frontend/Dockerfile）も node:24-alpine に揃えてある（2026-10-01、task #151）。
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: TypeScript (型検査)
        run: npx tsc -b

      - name: oxlint (静的解析)
        # 型検査が落ちても lint と build の結果は見たい。依存が入らなかったときだけ止める。
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: vitest (純関数の試験)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test

      - name: Build (tsc -b && vite build)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
