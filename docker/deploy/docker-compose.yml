# compose for the deployment hosts (shared by stg / prod).
# This file is the sole source: build.py copies it into the deploy bundle, and it is also baked into the api image
# (/app/docker/deploy/docker-compose.yml). On every deploy, deploy.sh extracts the in-image copy
# and overwrites docker-compose.yml at the destination, so
# hand edits to the destination file vanish on the next deploy. All per-environment differences
# are expressed in .env (WEB_HOST_PORT etc.).
services:
  api:
    image: ${API_IMAGE}
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-local@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-dev-password}
      # Auth / SSO. Keys not listed here do not reach the container even if written in .env,
      # i.e. you think you wrote AUTH_MODE=oidc but it starts without auth, which is
      # the hardest breakage to notice. When adding keys, always add them here too.
      # See README "SSO (IdP integration)" and .env.example for what each key means.
      AUTH_MODE: ${AUTH_MODE:-single_user}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_HTTP_TIMEOUT_SECONDS: ${OIDC_HTTP_TIMEOUT_SECONDS:-10}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-true}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
      OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
      OIDC_LINK_BY_EMAIL: ${OIDC_LINK_BY_EMAIL:-false}
      # Client identity when **we** query the IdP (periodic reconciliation). Empty means no reconciliation.
      MACHINE_CLIENT_ID: ${MACHINE_CLIENT_ID:-}
      MACHINE_PRIVATE_KEY_FILE: ${MACHINE_PRIVATE_KEY_FILE:-}
      MACHINE_PRIVATE_KEY_KID: ${MACHINE_PRIVATE_KEY_KID:-}
      MACHINE_AUDIENCE: ${MACHINE_AUDIENCE:-}
      MACHINE_READER_CLIENT_IDS: ${MACHINE_READER_CLIENT_IDS:-}
      ACCESS_TOKEN_EXPIRES_SECONDS: ${ACCESS_TOKEN_EXPIRES_SECONDS:-300}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:-}
      SESSION_SIGNING_KEY_FILE: ${SESSION_SIGNING_KEY_FILE:-}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-wbs_access_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_POST_LOGOUT_REDIRECT_URI: ${AUTH_POST_LOGOUT_REDIRECT_URI:-}
    volumes:
      - ${HOST_DATA_ROOT}/data:/app/data
    # The API is reachable only from inside the network. web (nginx) handles external exposure
    # via the /api/ proxy, so no host port is opened.
    expose:
      - "8000"
    command: ["/app/scripts/entrypoint.sh", "${APP_MODE:-app}"]
    # Restart automatically after host reboots or abnormal container exits (no manual steps needed after deploy).
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # The entrypoint runs DB migrations at startup, so allow enough margin
      # not to be misjudged as unhealthy until they finish. Probes still run every interval
      # during start_period, and a success makes it healthy immediately.
      start_period: 120s
  web:
    image: ${WEB_IMAGE}
    ports:
      - "${WEB_HOST_PORT:-8100}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Check connectivity through the whole nginx -> api proxy path (busybox wget).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
