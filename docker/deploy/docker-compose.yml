# デプロイ先ホスト用 compose（stg / prod 共通）。
# このファイルが唯一の出所: build.py が deploy bundle へコピーし、さらに api イメージ
# （/app/docker/deploy/docker-compose.yml）にも焼き込まれる。deploy.sh はデプロイの
# たびにイメージ内のコピーを取り出して配置先の docker-compose.yml を上書きするため、
# 配置先のファイルを手で編集しても次のデプロイで消える。環境ごとの違いはすべて
# .env 側（WEB_HOST_PORT 等）で表現する。
services:
  api:
    image: ${API_IMAGE}
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-local@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-dev-password}
      # 認証 / SSO。ここに並べていないキーは .env に書いてもコンテナへ渡らない
      # ＝ AUTH_MODE=oidc と書いたつもりで認証なしのまま起動する、という
      # 一番気づきにくい壊れ方をするので、増やしたら必ずここにも足す。
      # 各キーの意味は README「SSO（IdP 連携）」と .env.example を参照。
      AUTH_MODE: ${AUTH_MODE:-single_user}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_HTTP_TIMEOUT_SECONDS: ${OIDC_HTTP_TIMEOUT_SECONDS:-10}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-true}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
      OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-wbs_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_POST_LOGOUT_REDIRECT_URI: ${AUTH_POST_LOGOUT_REDIRECT_URI:-}
    volumes:
      - ${HOST_DATA_ROOT}/data:/app/data
    # API はネットワーク内部からのみ到達可能にする。外部公開は web (nginx) が
    # /api/ プロキシで受け持つため、ホストポートは開けない。
    expose:
      - "8000"
    command: ["/app/scripts/entrypoint.sh", "${APP_MODE:-app}"]
    # ホスト再起動・コンテナ異常終了後も自動で立ち上がる（デプロイ後の手動操作を不要にする）。
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # entrypoint が起動時に DB マイグレーションを実行するため、その完了まで
      # unhealthy と誤判定されないよう余裕を持たせる。start_period 中も probe は
      # interval ごとに走り、成功すれば即 healthy になる。
      start_period: 120s
  web:
    image: ${WEB_IMAGE}
    ports:
      - "${WEB_HOST_PORT:-8100}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # nginx → api のプロキシ経路ごと疎通確認する（busybox wget）。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
