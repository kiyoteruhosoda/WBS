# Pin the project name so containers, networks and volumes are always created with the wbs- / wbs_
# prefix (independent of the checkout directory name).
name: wbs
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-task_scheduler}
      MARIADB_USER: ${MARIADB_USER:-wbs}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-wbspass}
      TZ: UTC
    ports: ["${DB_PORT:-3306}:3306"]
    volumes: ["db-data:/var/lib/mysql"]
    restart: unless-stopped
  api:
    image: wbs-api:${APP_VERSION:-local}
    # The /info (BuildInfo) version is not passed as a build-arg. Before the build,
    # scripts/generate_version.sh writes src/infrastructure/version.json (ADR-0011).
    build:
      context: .
    environment:
      # Contract: containers are uniformly UTC (HANDOVER §14)
      TZ: UTC
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-local@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-dev-password}
      # Auth. Default is single_user (no auth, as before). Use oidc when exposed publicly.
      # See README "SSO (IdP integration)" and .env.example for details.
      AUTH_MODE: ${AUTH_MODE:-single_user}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_HTTP_TIMEOUT_SECONDS: ${OIDC_HTTP_TIMEOUT_SECONDS:-10}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-true}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}
      OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
      OIDC_LINK_BY_EMAIL: ${OIDC_LINK_BY_EMAIL:-false}
      # Client identity when **we** query the IdP (periodic reconciliation). Empty means no reconciliation.
      MACHINE_CLIENT_ID: ${MACHINE_CLIENT_ID:-}
      MACHINE_PRIVATE_KEY_FILE: ${MACHINE_PRIVATE_KEY_FILE:-}
      MACHINE_PRIVATE_KEY_KID: ${MACHINE_PRIVATE_KEY_KID:-}
      MACHINE_AUDIENCE: ${MACHINE_AUDIENCE:-}
      MACHINE_READER_CLIENT_IDS: ${MACHINE_READER_CLIENT_IDS:-}
      ACCESS_TOKEN_EXPIRES_SECONDS: ${ACCESS_TOKEN_EXPIRES_SECONDS:-300}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:-}
      SESSION_SIGNING_KEY_FILE: ${SESSION_SIGNING_KEY_FILE:-}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-wbs_access_token}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_POST_LOGOUT_REDIRECT_URI: ${AUTH_POST_LOGOUT_REDIRECT_URI:-}
    volumes: ["api-data:/app/data"]
    ports: ["${API_PORT:-8000}:8000"]
    depends_on: [db]
    command: ["/app/scripts/entrypoint.sh", "${APP_MODE:-app}"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # The entrypoint runs DB migrations at startup, so allow enough margin
      # not to be misjudged as unhealthy until they finish.
      start_period: 120s
  web:
    image: wbs-web:${APP_VERSION:-local}
    build: ./frontend
    environment:
      # Contract: containers are uniformly UTC (HANDOVER §14)
      TZ: UTC
    # External listening port (default 8100). api is reached via nginx's /api/ proxy.
    ports: ["${WEB_PORT:-8100}:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Check connectivity through the whole nginx -> api proxy path (busybox wget).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
volumes:
  db-data:
  api-data:
